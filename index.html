<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://browndeeplearning.com" />
    <title>Redirecting...</title>
    <script>
      // Immediate redirect using JavaScript as a fallback
      window.location.replace("https://browndeeplearning.com");
    </script>
  </head>
  <body>
    <!-- Fallback link in case both meta refresh and JavaScript fail -->
    <p>Redirecting to <a href="https://browndeeplearning.com">browndeeplearning.com</a>...</p>
  </body>
</html>
